# dnsmasq for the USB gadget link (usb0) — DHCP only.
# The device keeps 192.168.123.100 statically (see S99usb-gadget); the
# Linux host plugged into the USB-C port gets 192.168.123.10..99 and can
# SSH straight to 192.168.123.100 with no manual host-side setup.
interface=usb0
bind-interfaces
dhcp-range=192.168.123.10,192.168.123.99,12h
# DHCP only — no DNS server on the gadget link
port=0
