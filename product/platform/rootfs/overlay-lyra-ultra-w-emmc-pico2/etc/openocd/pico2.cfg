# Luckfox Lyra Ultra W -> RP2350 (Pico 2) SWD bit-bang interface.
#
# Wiring (33-pin RMIO header):
#   RMIO24 = GPIO1_PB1 (sysfs 41) -> SWCLK  (Pico 2 debug pad SWCLK)
#   RMIO25 = GPIO1_PB2 (sysfs 42) -> SWDIO  (Pico 2 debug pad SWDIO)
#   GND                                   -> Pico 2 debug pad GND
# (RMIO26 = GPIO1_PB3 = sysfs 43 is reserved/spare; RP2350 has no SRST.)
# Power the Pico 2 from its own 5V/USB supply; both sides are 3.3 V logic.
#
# The kernel is built with CONFIG_GPIO_SYSFS=y, so the sysfsgpio adapter
# bit-bangs SWD over /sys/class/gpio.  Run openocd as root (the helper
# `pico2` in /usr/bin does this).
#
# Note: this RP2350 OpenOCD snapshot registers the gpio numbers under the
# driver's own `sysfsgpio <name>_num <gpio>` commands.  The generic
# `adapter gpio swclk/swdio` form is consumed by the linuxgpiod driver
# (not compiled in here) and would be silently ignored — leaving the pins
# unset and the probe failing with "Require swclk and swdio gpio for SWD mode".
adapter driver sysfsgpio
sysfsgpio swclk_num 41
sysfsgpio swdio_num 42
adapter speed 100
transport select swd
source [find target/rp2350.cfg]
