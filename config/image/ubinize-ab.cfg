# UBI image layout for the A/B board's rootfs slots.
#
# u-boot's ab_update_root_partition() hard-codes the UBI volume name for the
# A/B root partition as `system` (root=ubi0:system, see common/android_ab.c).
# The vendored fs/ubi/ubinize.cfg uses vol_name=rootfs, so the A/B buildroot
# defconfig switches to this file via
#   BR2_TARGET_ROOTFS_UBI_USE_CUSTOM_CONFIG=y
#   BR2_TARGET_ROOTFS_UBI_CUSTOM_CONFIG_FILE="fs/ubi/ubinize-ab.cfg"
# (stages/30-rootfs/run.sh copies this file into the vendored buildroot before
# the buildroot step runs).
#
# vol_flags=autoresize lets the volume fill the whole system_<slot> MTD
# partition on first attach, so the same image fits both 96 MB slots.
[ubifs]
mode=ubi
vol_id=0
vol_type=UBI_VOL_TYPE
vol_name=system
vol_alignment=1
vol_flags=autoresize
image=BR2_ROOTFS_UBI_PATH
